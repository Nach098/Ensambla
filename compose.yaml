# Entorno local: PostgreSQL, migraciones y servidor de Ensambla.
name: ensambla
x-app: &app
  build: .
  image: ensambla:local
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: 3000
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    DATABASE_URL: postgresql://ensambla:${POSTGRES_PASSWORD:-ensambla_local}@db:5432/ensambla
    TRUST_PROXY: 'false'
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ensambla
      POSTGRES_DB: ensambla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ensambla_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ensambla -d ensambla']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ['node', 'backend/dist/database/cli.js']
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *app
    init: true
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
volumes:
  postgres_data:
